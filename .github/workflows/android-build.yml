name: Android CI

on:
  push:
    branches: [main, 'arena/**']
    paths: ['android/**', 'tools/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', 'tools/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned SDK components
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and verify both variants
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest -PallowUnsignedRelease=true --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-checks.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish reports and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/
          retention-days: 14
          if-no-files-found: warn
      - name: Report actionable failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 tools/ci_diagnostics.py > "$RUNNER_TEMP/diagnostics.md"
          cat "$RUNNER_TEMP/diagnostics.md"
          if [ -z "${PR_NUMBER:-}" ]; then PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty'); fi
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/diagnostics.md" || true
          fi

  emulator:
    name: Device integration · API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native device integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 2048
          working-directory: ${{ github.workspace }}
          script: bash tools/run_android_device_test.sh
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-qa-api-${{ matrix.api }}
          include-hidden-files: true
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            .qa/screenshots/
            ${{ runner.temp }}/window-state.txt
            ${{ runner.temp }}/device-log.txt
            .qa/device-checks.log
          retention-days: 14
      - name: Report device test failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 tools/ci_diagnostics.py > "$RUNNER_TEMP/device-diagnostics.md"
          if [ -f ".qa/device-checks.log" ]; then
            {
              echo
              echo "### Emulator runner output"
              echo '```text'
              tail -n 160 ".qa/device-checks.log"
              echo '```'
            } >> "$RUNNER_TEMP/device-diagnostics.md"
          fi
          cat "$RUNNER_TEMP/device-diagnostics.md"
          if [ -z "${PR_NUMBER:-}" ]; then PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty'); fi
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/device-diagnostics.md" || true
          fi
