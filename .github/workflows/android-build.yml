name: Android CI

# Continuous verification of the Android app: compile, unit tests, lint and both APK
# variants. Signing and publishing live in release.yml so secrets are only ever touched
# on a tagged release.
#
# On failure this job re-runs the failing Gradle invocation and posts the compiler / test
# output as a PR comment, so the exact diagnostics are available without downloading logs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}" || { echo "Android SDK directory is missing"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Report signing availability
        run: gradle :app:printReleaseSigningStatus --console=plain

      - name: Compile main sources
        run: gradle :app:compileDebugKotlin --console=plain

      - name: Compile unit tests
        run: gradle :app:compileDebugUnitTestKotlin --console=plain

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Run Android lint
        run: gradle :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Assemble release APK
        run: gradle :app:assembleRelease --console=plain

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Debug APK present:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-volume-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the compiler / test diagnostics as a PR comment so they can be read
      # without downloading the raw run logs.
      #
      # The assertion messages live in the JUnit XML, not in Gradle's console output, so
      # they are extracted from there: a bare "AssertionError at File.kt:103" tells you
      # where a test died but not what it expected.
      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --continue --console=plain > /tmp/gradle-fail.log 2>&1 || true
          {
            echo '### Android CI — diagnostics'
            echo
            echo '#### Failing tests'
            echo
            XML_DIR="app/build/test-results/testDebugUnitTest"
            if compgen -G "$XML_DIR/*.xml" > /dev/null; then
              echo '```text'
              python3 - "$XML_DIR" <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          total = failed = 0
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "*.xml"))):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  total += 1
                  for kind in ("failure", "error"):
                      for node in case.findall(kind):
                          failed += 1
                          print(f"{case.get('classname')} > {case.get('name')}")
                          text = (node.get("message") or "").strip()
                          body = (node.text or "").strip()
                          print("  message : " + (text or "(none)"))
                          for line in body.splitlines():
                              if "dev.virtualvolume" in line or "AssertionError" in line:
                                  print("  at      : " + line.strip())
                          print()
          print(f"{failed} failed / {total} tests")
          PY
              echo '```'
            else
              echo '_No JUnit XML was produced — the build failed before tests ran._'
            fi
            echo
            echo '#### Compiler / build output'
            echo
            echo '```text'
            grep -E 'e: |error:|FAILED|warning: ' /tmp/gradle-fail.log | head -60 || true
            echo '---'
            tail -n 40 /tmp/gradle-fail.log
            echo '```'
          } > /tmp/comment.md
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/pull/* ]]; then
            NUM="$(echo "$REF" | cut -d/ -f3)"
            gh pr comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md || true
          else
            cat /tmp/comment.md
          fi
